<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>让皖皖帮你找东西！</title>
<style>
/* 站点内版本：不用 Google Fonts（国内加载不到），换系统衬线 */

/* 基础重置 */
body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    background-color: #0b0710; /* 深邃夜空底色 */
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Source Han Serif SC', Georgia, serif;
    overflow: hidden;
}

/* 游戏主容器 - Whimsigoth 魔法暗室 */
#game-container {
    width: 100%; max-width: 450px; height: 100%; box-sizing: border-box;
    background: linear-gradient(135deg, #1a1020 0%, #0b0710 100%);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 15px rgba(201,168,106,0.1) inset;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    transition: all 1s ease;
    border: 2px solid #3a2230; /* 暗红紫包边 */
}

/* 主题：忧郁 (Melancholic) */
.theme-melancholic {
    background: linear-gradient(135deg, #1c252e 0%, #0f1419 100%) !important;
    border-color: #4a6274 !important;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 15px rgba(176,196,222,0.1) inset;
}
.theme-melancholic #screen {
    background: rgba(27, 38, 48, 0.8) !important;
    border-bottom-color: #4a6274 !important;
    color: #a3b8c8;
}
.theme-melancholic .item-btn {
    border-color: #4a6274; color: #a3b8c8; background: rgba(15,20,25,0.8);
}

/* 主题：绝望 (Despair) */
.theme-despair {
    background: #111 !important;
    border-color: #333 !important;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    filter: grayscale(100%) contrast(1.2);
}
.theme-despair #screen {
    background: #1a1a1a !important;
    border-bottom-color: #333 !important;
    color: #666;
}

/* 顶部文本展示区 */
#screen {
    flex: 2;
    background: rgba(26, 16, 32, 0.6);
    padding: 20px;
    position: relative;
    border-bottom: 2px dashed #3a2230;
    overflow-y: auto;
    color: #d1c9c3; /* 苍白的羊皮纸色 */
    font-size: 15px;
    line-height: 1.8;
    transition: all 1s ease;
    text-shadow: 0 0 8px rgba(201,168,106,0.15);
}

/* 皖皖出镜：底图铺满「弹文字」那块，再压一整个均匀的半透明遮罩 */
#screen::before {
    content: "";
    position: absolute; inset: 0;
    z-index: 0;
    pointer-events: none;
    background: url('wanwan.webp') center 20% / cover no-repeat;
}
#screen::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(11, 7, 16, 0.55);
}
#text-content {
    position: relative; z-index: 1;
    color: #ece4da;
    text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.55);
}
#text-content { position: relative; z-index: 1; }
#count-display { z-index: 2; }
#screen-credit {
    position: absolute; right: 10px; bottom: 8px; z-index: 2;
    font-family: 'STXingkai', '华文行楷', 'KaiTi', '楷体', 'STKaiti', cursive;
    font-size: 12px; line-height: 1.2; letter-spacing: 0.06em;
    color: #e9cd8f;
    text-shadow: 0 0 9px rgba(201,168,106,0.75), 0 1px 3px rgba(0,0,0,0.95);
    opacity: 0.9; pointer-events: none;
}

#count-display {
    position: absolute; top: 10px; right: 15px;
    font-size: 12px; font-weight: bold;
    color: #c9a86a; /* 暗金色 */
    background: rgba(11, 7, 16, 0.8);
    padding: 2px 10px; border-radius: 10px;
    border: 1px solid rgba(201,168,106,0.3);
}

#text-content { white-space: pre-wrap; min-height: 80px; margin-top: 15px; }

/* 按钮区 */
#button-area {
    flex: 3;
    background: rgba(11, 7, 16, 0.5);
    padding: 15px; overflow-y: auto;
    display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
    transition: all 1s ease;
}

/* 物品按钮 */
.item-btn {
    background: rgba(58, 18, 32, 0.5);
    border: 1px solid rgba(201,168,106,0.4);
    color: #c9a86a;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
.item-btn:hover {
    background: rgba(58, 18, 32, 0.9);
    border-color: #c9a86a;
    box-shadow: 0 0 10px rgba(201,168,106,0.3);
}
.item-btn:active { transform: scale(0.95); }

/* 结束按钮 */
.stop-btn {
    background: #3a1220; color: #e8e0d0;
    border: 1px solid #c9a86a;
    border-radius: 6px; padding: 10px 20px;
    font-size: 14px; font-weight: bold;
    cursor: pointer; margin-top: 10px; width: 100%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: all 0.3s;
}
.stop-btn:hover { background: #501a2e; }

/* 结算界面 */
#end-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(11, 7, 16, 0.95); z-index: 10;
    display: none; flex-direction: column; padding: 25px;
    box-sizing: border-box; overflow-y: auto; text-align: center;
    backdrop-filter: blur(5px);
}
.theme-melancholic #end-screen { background: rgba(15, 20, 25, 0.95); }
.theme-despair #end-screen { background: #000; }

#end-title { font-size: 22px; color: #c9a86a; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
#end-summary { font-size: 16px; color: #e8e0d0; margin-bottom: 20px; font-weight: bold; }
#end-text { font-size: 14px; color: #a699b5; line-height: 1.9; text-align: left; margin-bottom: 30px; white-space: pre-wrap; }

.restart-btn {
    background: transparent; color: #c9a86a;
    border: 1px solid #c9a86a;
    border-radius: 6px; padding: 10px 30px;
    font-size: 16px; font-weight: bold; cursor: pointer; align-self: center;
    box-shadow: 0 0 10px rgba(201,168,106,0.2);
    transition: all 0.3s;
}
.restart-btn:hover { background: rgba(201,168,106,0.1); }

/* 打字机光标 */
.blinking-cursor::after {
    content: '❖'; /* 把竖线换成小星光/魔法符号 */
    animation: blink 1s step-end infinite;
    color: #c9a86a;
    margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: #3a2230; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #c9a86a; }
</style>
</head>
<body>

<div id="game-container" class="theme-normal">
    <div id="screen">
        <span id="screen-credit">角色来源：熬肉</span>
        <div id="count-display">求助次数: 0</div>
        <div id="text-content" class="blinking-cursor">老婆，你的东西又乱丢了？<br>叹气……说吧，这次又找不着什么了？<br>只要不是让我帮你找别的野男人，我都能给你翻出来。</div>
    </div>
    <div id="button-area"></div>
    <div id="end-screen">
        <div id="end-title">评估报告</div>
        <div id="end-summary"></div>
        <div id="end-text"></div>
        <button class="restart-btn" onclick="restart()">重新找</button>
    </div>
</div>

{name:"没吃完的薯片",text:"被我没收了，谁让你昨天晚上不吃饭光吃零食的。\n今天做了你喜欢的辣炒螺蛳，已经挑过蒜末了。\n乖乖吃饭，吃完再考虑把薯片还给你。"},
{name:"李砚秋的良心",text:"那老头有良心这种东西吗？他只有八卦的心。\n别找了，找遍整个静安区你也翻不出他的底线。\n有这闲工夫，不如多摸摸我的尾巴。"},

{name:"防晒霜",text:"在你的托特包夹层里，你出门前自己塞进去的。\n你的记性真是一天比一天差了，小笨蛋。\n过来，我帮你涂，保证每一寸皮肤都不落下。"},
{name:"我的腹肌",text:"昨天晚上你不是刚摸过吗？还咬了好几个印子。\n现在它们就在这件衬衫下面，随时欢迎你查收。\n要不要把手放上来感受一下？"},

{name:"节操",text:"我们之间还有这种东西吗？从第一次你闯进来开始就没了吧。\n反正我也早就对你没有底线了。\n你要是喜欢，今晚我们可以更没节操一点。"},
{name:"指甲剪",text:"在茶几底下的收纳盒里，被几本书挡住了。\n要剪指甲吗？把手伸过来，我帮你剪。\n顺便帮你把边缘磨平，免得晚上抓伤我。"},
{name:"昨天的天气",text:"我是能感知玛那，但我不能逆转时间啊老婆。\n不过如果你喜欢下雨天，我可以去院子里洒水。\n只要能让你开心，让我做人工降雨机都行。"},

let totalClicks=0;
let findCharClicks=0;
let typingInterval=null; // 修复打字机 Bug 的核心变量

const buttonArea=document.getElementById('button-area');
const screenText=document.getElementById('text-content');
const countDisplay=document.getElementById('count-display');
const gameContainer=document.getElementById('game-container');
const endScreen=document.getElementById('end-screen');

function initButtons(){
    buttonArea.innerHTML='';
    const shuffled=[...items].sort(()=>Math.random()-0.5);
    shuffled.forEach(item=>{
        const btn=document.createElement('button');
        btn.className='item-btn';
        btn.innerText=item.name;
        btn.onclick=()=>handleBtnClick(item);
        buttonArea.appendChild(btn);
    });
    const stopBtn=document.createElement('button');
    stopBtn.className='stop-btn';
    stopBtn.innerText='不找了！(╥_╥)';
    stopBtn.onclick=showEndScreen;
    buttonArea.appendChild(stopBtn);
}

function handleBtnClick(item){
    totalClicks++;
    countDisplay.innerText='求助次数: '+totalClicks;
    if(item.name==="找皖皖") findCharClicks++;
    typeText(item.text);
}

// 修复打字机：连续点击时不再文字重叠
function typeText(text){
    if(typingInterval) clearInterval(typingInterval); // 清除上一次未打完的进度
    screenText.innerHTML='';
    let i=0;
    typingInterval=setInterval(()=>{
        screenText.innerHTML=text.substring(0,i)+'<span class="blinking-cursor"></span>';
        i++;
        if(i>text.length){
          clearInterval(typingInterval);
          screenText.innerHTML=text;
        }
    },30);
}

function showEndScreen(){
    gameContainer.className='';
    endScreen.style.display='flex';
    document.getElementById('end-title').innerText='评估报告';
    
    if(findCharClicks>=40){
        gameContainer.classList.add('theme-despair');
        document.getElementById('end-title').innerText='特殊结局：深海幻影';
        document.getElementById('end-summary').innerText='【查无此人】';

    }
    if(findCharClicks>=21){
        gameContainer.classList.add('theme-melancholic');
        document.getElementById('end-title').innerText='特殊结局：雨夜回溯';

        return;
    }
    if(findCharClicks>=10){
        gameContainer.classList.add('theme-normal');
        document.getElementById('end-title').innerText='特殊结局：肌肤相亲';
        document.getElementById('end-summary').innerText='【热恋黏人精】';
        document.getElementById('end-text').innerText='“又在找什么？”他从背后环住你的腰，下巴自然地搁在你的颈窝里，鼻尖蹭着你的肌肤，带来一阵熟悉的温热和海盐香气。你靠在他怀里，听着他沉稳的心跳，其实你什么都没丢，只是突然很想被他这样抱着。他似乎察觉到了你的小心思，低沉地笑了一声，胸腔的震动传导到你的后背。\n“既然没事干，不如来找找我的触手去哪了？”他故意压低声音，略带凉意的指节顺着你的衣摆滑了进去。你转身勾住他的脖子，顺势跨坐在他腿上。他稳稳地托住你，任由你捏住他的下巴。阳光透过落地窗洒在地毯上，麻花在角落里打了个哈欠，而你们在这方小天地里，用最原始的体温确认着彼此的存在。找不到东西又怎样？只要这个人还在手边，世界就依然完美运转。';
        return;
    }

    gameContainer.classList.add('theme-normal');
    let title='',text='';
    if(totalClicks<=10){
        title='【独立自强】';
        text='才找了这么几次？看来我们A组的女强人生活自理能力还是很强的嘛。不过，蒋组长似乎有点小失落呢，他可是准备了满满一肚子的话想借机对你撒娇邀功的。下次装作找不到东西的样子，多给他一点表现的机会吧！毕竟那条深海章鱼最大的乐趣，就是围着你转。';
    }else if(totalClicks<=20){
        title='【日常小迷糊】';
        text='不愧是你，丢三落四的日常频率。不过没关系，你有一个人形自走雷达兼全职保姆。看他一边叹气一边认命地跟在你屁股后面收拾烂摊子，是不是觉得特别有成就感？这份专属的纵容，可是别人求都求不来的。';
    }else if(totalClicks<=30){
        title='【重度依赖症】';
        text='你这已经不是找不到东西了，你这是重度“皖皖依赖症”！连吃剩的薯片都要他去拿，你那条蛇尾巴是用来当摆设的吗？不过蒋皖夜显然非常享受这种被你彻底依赖的感觉，他的占有欲在你的呼唤中得到了极大的满足。';
    }else if(totalClicks<=40){
        title='【恃宠而骄】';
        text='过分了啊！你这纯粹是在把堂堂SCA华东区A组组长当成寻回犬在用。你的每一次点击，都是在疯狂试探他的底线。但事实证明，他对你根本没有底线。你哪怕让他去大海里捞针，他也会立刻脱了西装跳进去。这大概就是被偏爱的有恃无恐吧。';
    }else if(totalClicks<=50){
        title='【无理取闹大魔王】';
        text='你已经彻底放飞自我了！连三体人和老头的良心都让他找，你的脑洞比黑洞还大。蒋皖夜的触手估计都要被你指挥得打结了。不过，看着他被你折腾得满头大汗却依然温柔回应的样子，是不是觉得这个男人真的爱你入骨？';
    }else{
        title='【静安区寻物终结者】';
        text='突破天际的求助次数！你硬生生把一个恋爱游戏玩成了点点点解压软件。蒋皖夜已经累瘫在沙发上了，连育子房都提不起一丝力气。但即便如此，只要你再喊一声“老婆找不到了”，他还是会垂死病中惊坐起。恭喜你，成功驯服了这条两百岁的海怪。';
    }
    
    document.getElementById('end-summary').innerText=title;
    document.getElementById('end-text').innerText=text;
}

function restart(){
    totalClicks=0;
    findCharClicks=0;
    countDisplay.innerText='求助次数: 0';
    screenText.innerHTML='老婆，你的东西又乱丢了？<br>叹气……说吧，这次又找不着什么了？<br>只要不是让我帮你找别的野男人，我都能给你翻出来。';
    endScreen.style.display='none';
    gameContainer.className='theme-normal';
    initButtons();
}

window.onload=initButtons;
</script>
